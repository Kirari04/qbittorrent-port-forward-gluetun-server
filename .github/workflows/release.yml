name: Release

on:
  push:
    branches:
      - main
  release:
    types:
      - published

env:
  platforms: "linux/amd64,linux/arm64/v8,linux/riscv64"

permissions:
  contents: read

jobs:
  release:
    name: "Release"
    environment: release
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read  # This is required for actions/checkout
      packages: write # This is required for pushing Docker images to ghcr.io
    steps:
      - name: 🚚 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        id: setup-buildx

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Calculate metadata for minimal Docker images
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=edge
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index

      - name: 🚀 Build and deploy minimal Docker images
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          target: "minimal"
          context: .
          file: ./Dockerfile
          push: true
          cache-from: "" # Don't use cache on pull request builds to avoid cache poisoning attacks, but do populate it for release builds
          cache-to: "type=gha,mode=max" # Populate cache on release builds, but don't use it to avoid cache poisoning attacks on pull request builds
          platforms: ${{ env.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: "mode=max"
